<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homemade-Instrument-Project</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(5, 120px);
      gap: 20px;
    }

    img {
      width: 120px;
      height: 120px;
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.2s;
    }

    img:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

<div class="container">
  <img src="image1.png" data-alt="image2.png" data-freq="261.6">
  <img src="image1.png" data-alt="image2.png" data-freq="293.7">
  <img src="image1.png" data-alt="image2.png" data-freq="329.6">
  <img src="image1.png" data-alt="image2.png" data-freq="349.2">
  <img src="image1.png" data-alt="image2.png" data-freq="392.0">
</div>

<script>
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  let currentOsc = null;
let currentGain = null;

function startTone(freq) {
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.frequency.value = freq;
  osc.type = "sine";

  osc.connect(gain);
  gain.connect(ctx.destination);

  gain.gain.setValueAtTime(1, ctx.currentTime);

  osc.start();

  currentOsc = osc;
  currentGain = gain;
}

function stopTone() {
  if (currentGain && currentOsc) {
    currentGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    currentOsc.stop(ctx.currentTime + 0.1);
    currentOsc = null;
    currentGain = null;
  }
}

function playShort(freq) {
  startTone(freq);
  setTimeout(() => stopTone(), 100);
}

  document.querySelectorAll("img").forEach(img => {
    const freq = parseFloat(img.dataset.freq);
    let holding = false;

    img.addEventListener("mousedown", async () => {
      await ctx.resume();
      holding = true;

      // ALWAYS switch image on press
      img.src = img.dataset.alt;

      startTone(freq);
    });

    img.addEventListener("mouseup", () => {
      if (holding) {
        stopTone();
        holding = false;
      }
    });

    img.addEventListener("mouseleave", () => {
      if (holding) {
        stopTone();
        holding = false;
      }
    });

    img.addEventListener("click", async () => {
      await ctx.resume();

      // ALSO force image change on click (backup)
      img.src = img.dataset.alt;

      if (!holding) {
        playShort(freq);
      }
    });
  });

    img.addEventListener("mouseup", () => {
      if (holding) {
        stopTone();
        holding = false;
      }
    });

    img.addEventListener("mouseleave", () => {
      if (holding) {
        stopTone();
        holding = false;
      }
    });

    img.addEventListener("click", async () => {
      await ctx.resume();
      if (!holding) {
        img.src = img.dataset.alt;
        playShort(freq);
      }
    });
  });
  });
</script>

</body>
</html>
